# thermal-engine configuration for cityman (Lumia 950 XL, MSM8994 v2.1).
#
# Read explicitly by init (thermal-engine -c), not through the bullhead
# binary's own target table. Temperatures in millidegrees C.
#
# Sensors (tsens hardware id = tsens_tz_sensorN; thermal_zoneN+2 on this
# kernel):  A53 cpu0-3 = tsens 7, 8, 9, 10   A57 cpu4-7 = tsens 13, 14, 15, 6
#           pop_mem = tsens 2   gpu = tsens 12   board = msm_therm
#
# CPU frequencies (kHz):  A53 384000 ... 1555200   A57 384000 ... 1958400
# GPU frequencies (Hz):   630000000 510000000 450000000 390000000
#                         305000000 180000000 27000000
#
# Only monitor rules, so every limit is a fixed step with its own clear
# temperature. BCL stays with the kernel (no BCL section here). The
# kernel limits stay underneath: A57 at 1.248 GHz from 80 C on an A57
# core, core offline at 95 C, reset at 115 C. Values are a first,
# conservative set to be tuned from measurements.

# A57 cores: step the big cluster down from its own sensors.
[MONITOR-A57-CPU4]
algo_type        monitor
sensor           tsens_tz_sensor13
sampling         500
thresholds       72000        76000        80000        85000
thresholds_clr   68000        72000        76000        81000
actions          cluster1     cluster1     cluster1     cluster1
action_info      1632000      1440000      1248000      960000

[MONITOR-A57-CPU5]
algo_type        monitor
sensor           tsens_tz_sensor14
sampling         500
thresholds       72000        76000        80000        85000
thresholds_clr   68000        72000        76000        81000
actions          cluster1     cluster1     cluster1     cluster1
action_info      1632000      1440000      1248000      960000

[MONITOR-A57-CPU6]
algo_type        monitor
sensor           tsens_tz_sensor15
sampling         500
thresholds       72000        76000        80000        85000
thresholds_clr   68000        72000        76000        81000
actions          cluster1     cluster1     cluster1     cluster1
action_info      1632000      1440000      1248000      960000

[MONITOR-A57-CPU7]
algo_type        monitor
sensor           tsens_tz_sensor6
sampling         500
thresholds       72000        76000        80000        85000
thresholds_clr   68000        72000        76000        81000
actions          cluster1     cluster1     cluster1     cluster1
action_info      1632000      1440000      1248000      960000

# A53 cores: limit the little cluster only when it gets hot itself.
[MONITOR-A53-CPU0]
algo_type        monitor
sensor           tsens_tz_sensor7
sampling         1000
thresholds       85000        90000
thresholds_clr   80000        85000
actions          cluster0     cluster0
action_info      1248000      960000

[MONITOR-A53-CPU1]
algo_type        monitor
sensor           tsens_tz_sensor8
