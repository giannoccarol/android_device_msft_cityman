sensor           tsens_tz_sensor10
sampling         1000
thresholds       85000        90000
thresholds_clr   80000        85000
actions          cluster0     cluster0
action_info      1248000      960000

# Memory stacked on the SoC.
[MONITOR-POP-MEM]
algo_type        monitor
sensor           tsens_tz_sensor2
sampling         1000
thresholds       75000        80000
thresholds_clr   70000        75000
actions          cluster1     cluster1
action_info      1248000      960000

# GPU core.
[MONITOR-GPU]
algo_type        monitor
sensor           tsens_tz_sensor12
sampling         1000
thresholds       80000        85000        90000
thresholds_clr   75000        80000        85000
actions          gpu          gpu          gpu
action_info      450000000    305000000    180000000

# Board temperature (near the SoC): what the user feels.
[MONITOR-BOARD-A57]
algo_type        monitor
sensor           msm_therm
sampling         1000
thresholds       50000        54000        58000
thresholds_clr   48000        52000        56000
actions          cluster1     cluster1     cluster1
action_info      1440000      1248000      960000

[MONITOR-BOARD-A53]
algo_type        monitor
sensor           msm_therm
sampling         1000
thresholds       56000        60000
thresholds_clr   54000        58000
actions          cluster0     cluster0
action_info      1248000      960000

[MONITOR-BOARD-GPU]
algo_type        monitor
sensor           msm_therm
sampling         1000
thresholds       52000        56000        60000
thresholds_clr   50000        54000        58000
actions          gpu          gpu          gpu
action_info      510000000    390000000    305000000

[MONITOR-BOARD-HOTPLUG]
algo_type        monitor
sensor           msm_therm
sampling         1000
thresholds       56000        58000        60000
thresholds_clr   54000        56000        58000
actions          hotplug_5+hotplug_6+hotplug_7 hotplug_5+hotplug_6+hotplug_7 hotplug_5+hotplug_6+hotplug_7
action_info      0+0+1        0+1+1        1+1+1

[MONITOR-BOARD-SHUTDOWN]
algo_type        monitor
sensor           msm_therm
sampling         1000
thresholds       68000
thresholds_clr   65000
actions          shutdown
action_info      1

# Battery: lower the charge current (qcom,ibat-thermal-mitigation levels).
[MONITOR-BATTERY]
algo_type        monitor
sensor           battery
sampling         5000
thresholds       42000        44000        45000
thresholds_clr   40000        42000        43000
actions          battery      battery      battery
action_info      1            2            3

# PMIC die alarm, as on angler.
[PMIC-ALARM-MONITOR]
algo_type        monitor
sensor           pm8994_tz
sampling         1000
thresholds       107000 127000
thresholds_clr   103000 123000
actions          hotplug_7+hotplug_6+hotplug_5+hotplug_4+hotplug_3+hotplug_2+hotplug_1+cluster1+cluster0 hotplug_7+hotplug_6+hotplug_5+hotplug_4+hotplug_3+hotplug_2+hotplug_1
action_info      0+0+0+0+0+0+0+302400+302400 1+1+1+1+1+1+1

# Cold: raise the minimum rail voltages below 5 C (as on angler).
[VDD_RSTR_MONITOR-TSENS15]
algo_type        monitor
sensor           tsens_tz_sensor15
sampling         1000
thresholds       5000
thresholds_clr   10000
actions          vdd_restriction
action_info      1
descending

